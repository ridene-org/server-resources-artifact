version: '3.8'

# ============================================================================
# Shared Infrastructure Services for Multi-Tenant Applications
# ============================================================================
# This compose file deploys PostgreSQL, Valkey (Redis), and RabbitMQ as
# shared platform services. Other applications connect to these via host
# networking or a shared bridge network.
#
# Usage:
#   podman-compose up -d
#   podman-compose ps
#   podman-compose logs -f
# ============================================================================

networks:
  platform-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  valkey-data:
    driver: local
  rabbitmq-data:
    driver: local

services:
  # ========================================================================
  # PostgreSQL - Shared Database Server
  # ========================================================================
  # Multiple applications can create separate databases within this instance.
  # Connect via: postgresql://user:password@localhost:5432/dbname
  # ========================================================================
  postgres:
    image: postgres:15.7-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_Platform2024!}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================================
  # Valkey (Redis-compatible) - Shared Cache & Pub/Sub
  # ========================================================================
  # Drop-in replacement for Redis. Use different DB indexes for different apps.
  # Connect via: redis://localhost:6379/0 (DB 0 for app1, DB 1 for app2, etc.)
  # ========================================================================
  valkey:
    image: valkey/valkey:7.2.11-alpine
    container_name: platform-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory ${VALKEY_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ========================================================================
  # RabbitMQ - Shared Message Broker
  # ========================================================================
  # Use separate vhosts for different applications.
  # Management UI: http://localhost:15672 (admin/changeme)
  # AMQP URL: amqp://user:password@localhost:5672/vhostname
  # ========================================================================
  rabbitmq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-platform_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-ChangeMe_Platform2024!}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-platform}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
