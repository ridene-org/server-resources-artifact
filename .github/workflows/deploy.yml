name: Deploy Platform Infrastructure

on:
  push:
    branches: [ main ]
    

permissions:
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    # ========================================================================
    # ENVIRONMENT VARIABLES - GitHub Secrets for each environment
    # ========================================================================
    # These secrets contain base64-encoded .env files for each deployment env.
    # They are exposed to the job so select-env-secret can access them.
    # Format: <ENV_KEY>_ENV_B64 (e.g., PROD_ENV_B64, STAGING_ENV_B64, DEV_ENV_B64)
    # ========================================================================
    env:
      DEV_ENV_B64: ${{ secrets.ENV_B64 }}
      STAGING_ENV_B64: ${{ secrets.ENV_B64 }}
      PROD_ENV_B64: ${{ secrets.ENV_B64 }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose File
        run: |
          if [ ! -f "docker-compose.yaml" ]; then
            echo "::error::docker-compose.yaml not found"
            exit 1
          fi
          echo "✓ docker-compose.yaml found"

      - name: Encode Environment Files
        id: encode
        run: |
          if [ -f ".env" ]; then
            ENV_B64=$(base64 -w 0 .env)
            echo "env_b64=$ENV_B64" >> $GITHUB_OUTPUT
            echo "✓ Encoded .env file"
          else
            echo "::warning::.env file not found. Using defaults from .env.example"
            ENV_B64=$(base64 -w 0 .env.example)
            echo "env_b64=$ENV_B64" >> $GITHUB_OUTPUT
          fi
          
          COMPOSE_B64=$(base64 -w 0 docker-compose.yaml)
          echo "compose_b64=$COMPOSE_B64" >> $GITHUB_OUTPUT
          echo "✓ Encoded docker-compose.yaml"

      - name: Deploy Platform Stack
        uses: uncoverthefuture-org/actions@v1.6.1
        with:
          subaction: ssh-container-deploy
          params_json: |
            {
              "ssh_host": "${{ secrets.SERVER_HOST }}",
              "ssh_user": "${{ secrets.SERVER_USER }}",
              "ssh_key": "${{ secrets.SERVER_SSH_KEY }}",
              "version": "v1.0.0",
              "image_tag": "${{ github.sha }}",
              "prepare_host": "true",
              "enable_traefik": "false",
              "enable_acme": "false",
              "domain": "",
              "debug": "true",
              "use_compose": "true",
              "compose_yaml_b64": "${{ steps.encode.outputs.compose_b64 }}",
              "env_b64": "${{ steps.encode.outputs.env_b64 }}"
            }
